<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>New Competitor Entry</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; padding: 16px; margin: 0; color: #222; max-width: 640px; }
  h3 { margin: 18px 0 8px; padding-top: 12px; border-top: 1px solid #e0e0e0; }
  h3:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  label { display: block; font-size: 12px; color: #666; margin-top: 8px; }
  input[type=text], input[type=number], input[type=url], select {
    font-size: 14px; padding: 7px; margin-top: 2px; width: 100%; border: 1px solid #ccc; border-radius: 4px;
  }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .checkbox-line { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .checkbox-line input { width: auto; }
  .colour-row { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; padding: 6px; background: #f7f7f7; border-radius: 4px; flex-wrap: wrap; }
  .colour-type { flex: 0 0 150px; }
  .colour-search-wrap { flex: 1; position: relative; min-width: 160px; }
  .colour-search { width: 100%; }
  .colour-search.confirmed { border-color: #16a35a; background: #f0fff4; }
  .colour-suggestions {
    position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ccc;
    border-radius: 4px; margin-top: 2px; max-height: 220px; overflow-y: auto; z-index: 10;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: none;
  }
  .colour-suggestions.open { display: block; }
  .colour-suggestion { padding: 7px 9px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .colour-suggestion .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #ccc; flex: 0 0 auto; }
  .colour-suggestion.active { background: #e6f7ee; }
  .colour-instock-line { display: flex; align-items: center; gap: 4px; margin: 0; white-space: nowrap; padding-top: 8px; }
  .colour-instock-line input { width: auto; }
  .remove-colour { background: #d9534f; color: white; border: none; border-radius: 4px; padding: 6px 10px; cursor: pointer; align-self: flex-start; margin-top: 2px; }
  #addColourBtn { background: #eee; border: 1px dashed #999; border-radius: 4px; padding: 8px; width: 100%; margin-top: 8px; cursor: pointer; }
  #submitBtn { background: #16a35a; color: white; border: none; border-radius: 4px; padding: 12px; width: 100%; margin-top: 20px; font-size: 15px; cursor: pointer; }
  #submitBtn:disabled { background: #aaa; }
  #status { margin-top: 12px; white-space: pre-wrap; font-size: 13px; color: #555; min-height: 20px; }
  #status.error { color: #b00020; }
  #status.success { color: #16a35a; font-weight: 600; }
  .hint { font-size: 11px; color: #999; margin-top: 2px; }
</style>
</head>
<body>
  <h3>Competitor Info</h3>
  <label>Product Name</label>
  <input type="text" id="f_productName">

  <div class="row">
    <div>
      <label>Source Type</label>
      <input type="text" id="f_sourceType" placeholder="e.g. Shopee">
    </div>
    <div>
      <label>Shop Name</label>
      <input type="text" id="f_shopName">
    </div>
  </div>

  <label>Source Link</label>
  <input type="url" id="f_sourceLink">

  <div class="row">
    <div>
      <label>Reply Rate (0–1)</label>
      <input type="number" id="f_replyRate" step="0.01" min="0" max="1">
    </div>
    <div>
      <label>Score</label>
      <input type="number" id="f_score" step="1">
    </div>
    <div>
      <label>Item Number</label>
      <input type="number" id="f_itemNumber" step="1">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Stars</label>
      <input type="number" id="f_stars" step="0.1" min="0" max="5">
    </div>
    <div>
      <label>Review Count</label>
      <input type="number" id="f_reviewNum" step="1">
    </div>
    <div>
      <label id="f_provinceLabel">Province</label>
      <select id="f_province"></select>
    </div>
  </div>

  <label>Product Type</label>
  <div id="productTypeChoices"></div>

  <h3>Colors Sold at This Listing</h3>
  <div class="hint">Pick a type to narrow the list, then type the first few letters of the color and press Enter to select it.</div>
  <div id="colourRows"></div>
  <button type="button" id="addColourBtn">+ Add another color</button>

  <h3>Delivery</h3>
  <div class="checkbox-line"><input type="checkbox" id="f_instant"><label style="margin:0">Instant Delivery</label></div>
  <div class="checkbox-line"><input type="checkbox" id="f_express"><label style="margin:0">Express Delivery</label></div>
  <div class="checkbox-line"><input type="checkbox" id="f_standard"><label style="margin:0">Standard Delivery</label></div>

  <h3>Pricing</h3>
  <div class="row">
    <div>
      <label>Original Price</label>
      <input type="number" id="f_original" step="0.01">
    </div>
    <div>
      <label>Discounted Price</label>
      <input type="number" id="f_discount" step="0.01">
    </div>
  </div>

  <button id="submitBtn">Submit Entry</button>
  <div id="status"></div>

<script>
let fcList = [];         // [{id, name, type1, type2, hex, label, typeCombo}]
let typeCombos = [];     // sorted unique "Type1 Type2" strings
let provinceChoices = [];
let productTypeChoices = [];

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

function matchesQuery(candidate, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  return candidate.name.toLowerCase().startsWith(q) || candidate.hex.toLowerCase().includes(q);
}

function getFilteredCandidates(row) {
  const typeVal = row.querySelector('.colour-type').value;
  const query = row.querySelector('.colour-search').value.trim();
  let pool = fcList;
  if (typeVal) pool = pool.filter(c => c.typeCombo === typeVal);
  pool = pool.filter(c => matchesQuery(c, query));
  return pool.slice(0, 8);
}

function renderSuggestions(row) {
  const box = row.querySelector('.colour-suggestions');
  const candidates = getFilteredCandidates(row);
  row._activeIndex = 0;
  if (candidates.length === 0) {
    box.classList.remove('open');
    box.innerHTML = '';
    return;
  }
  box.innerHTML = candidates.map((c, i) => `
    <div class="colour-suggestion${i === 0 ? ' active' : ''}" data-idx="${i}">
      <span class="swatch" style="background:${c.hex}"></span>
      <span>${c.name} — ${c.type1} ${c.type2} (${c.hex})</span>
    </div>
  `).join('');
  box._candidates = candidates;
  box.classList.add('open');
  box.querySelectorAll('.colour-suggestion').forEach(el => {
    el.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const idx = Number(el.dataset.idx);
      selectCandidate(row, box._candidates[idx]);
    });
  });
}

function selectCandidate(row, candidate) {
  const input = row.querySelector('.colour-search');
  input.value = `${candidate.name} (${candidate.hex})`;
  input.classList.add('confirmed');
  row.dataset.colourRef = candidate.id;
  const box = row.querySelector('.colour-suggestions');
  box.classList.remove('open');
  box.innerHTML = '';
}

function addColourRow() {
  const wrap = document.getElementById('colourRows');
  const row = document.createElement('div');
  row.className = 'colour-row';
  row.innerHTML = `
    <select class="colour-type">
      <option value="">All types</option>
      ${typeCombos.map(t => `<option value="${t}">${t}</option>`).join('')}
    </select>
    <div class="colour-search-wrap">
      <input type="text" class="colour-search" placeholder="Type color name, press Enter" autocomplete="off">
      <div class="colour-suggestions"></div>
    </div>
    <label class="colour-instock-line">
      <input type="checkbox" class="colour-instock" checked> In stock
    </label>
    <button type="button" class="remove-colour">&times;</button>
  `;
  wrap.appendChild(row);

  const typeSelect = row.querySelector('.colour-type');
  const searchInput = row.querySelector('.colour-search');
  const suggestBox = row.querySelector('.colour-suggestions');

  typeSelect.addEventListener('change', () => {
    searchInput.value = '';
    searchInput.classList.remove('confirmed');
    delete row.dataset.colourRef;
    searchInput.focus();
    renderSuggestions(row);
  });

  searchInput.addEventListener('input', () => {
    searchInput.classList.remove('confirmed');
    delete row.dataset.colourRef;
    renderSuggestions(row);
  });

  searchInput.addEventListener('focus', () => renderSuggestions(row));

  searchInput.addEventListener('keydown', (e) => {
    const items = Array.from(suggestBox.querySelectorAll('.colour-suggestion'));
    if (e.key === 'Enter') {
      e.preventDefault();
      const candidates = suggestBox._candidates || [];
      if (candidates.length > 0) {
        selectCandidate(row, candidates[row._activeIndex || 0]);
      }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!items.length) return;
      row._activeIndex = Math.min((row._activeIndex || 0) + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('active', i === row._activeIndex));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      row._activeIndex = Math.max((row._activeIndex || 0) - 1, 0);
      items.forEach((el, i) => el.classList.toggle('active', i === row._activeIndex));
    } else if (e.key === 'Escape') {
      suggestBox.classList.remove('open');
    }
  });

  document.addEventListener('click', (e) => {
    if (!row.contains(e.target)) suggestBox.classList.remove('open');
  });

  row.querySelector('.remove-colour').addEventListener('click', () => row.remove());
}

async function init() {
  try {
    const fc = await grist.docApi.fetchTable('Filament_Colours');
    const comboSet = new Set();
    fcList = fc.id.map((id, i) => {
      const type1 = fc.Type_1[i] || '';
      const type2 = fc.Type_2[i] || '';
      const combo = `${type1} ${type2}`.trim();
      comboSet.add(combo);
      return {
        id,
        name: fc.Colour_Name[i] || '',
        type1, type2,
        hex: fc.ColourCode[i] || '',
        label: fc.Label[i] || '',
        typeCombo: combo,
      };
    }).sort((a, b) => a.name.localeCompare(b.name));
    typeCombos = Array.from(comboSet).filter(Boolean).sort();

    // Province (Choice) options from Competitors_ID column "A"
    const idCols = await grist.docApi.fetchTable('_grist_Tables_column');
    const tables = await grist.docApi.fetchTable('_grist_Tables');
    const cidTableRowId = tables.id[tables.tableId.indexOf('Competitors_ID')];
    const aIdx = idCols.colId.findIndex((c, i) => c === 'A' && idCols.parentId[i] === cidTableRowId);
    const ptIdx = idCols.colId.findIndex((c, i) => c === 'Product_Type' && idCols.parentId[i] === cidTableRowId);

    const aOpts = JSON.parse(idCols.widgetOptions[aIdx] || '{}');
    provinceChoices = aOpts.choices || [];
    document.getElementById('f_provinceLabel').textContent = idCols.label[aIdx] || 'Province';
    const provSelect = document.getElementById('f_province');
    provSelect.innerHTML = '<option value=""></option>' + provinceChoices.map(c => `<option value="${c}">${c}</option>`).join('');

    const ptOpts = JSON.parse(idCols.widgetOptions[ptIdx] || '{}');
    productTypeChoices = ptOpts.choices || [];
    const ptDiv = document.getElementById('productTypeChoices');
    ptDiv.innerHTML = productTypeChoices.map((c) =>
      `<label class="checkbox-line"><input type="checkbox" class="pt-choice" value="${c}"> ${c}</label>`
    ).join('');

    addColourRow();
  } catch (e) {
    setStatus('Failed to load form data: ' + e.message, 'error');
  }
}

document.getElementById('addColourBtn').addEventListener('click', () => addColourRow());

function num(id) {
  const v = document.getElementById(id).value;
  return v === '' ? null : Number(v);
}
function txt(id) {
  return document.getElementById(id).value.trim();
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  try {
    const productName = txt('f_productName');
    const shopName = txt('f_shopName');
    const sourceLink = txt('f_sourceLink');
    if (!productName || !shopName || !sourceLink) {
      setStatus('Product Name, Shop Name, and Source Link are required.', 'error');
      btn.disabled = false;
      return;
    }

    const colourRowEls = Array.from(document.querySelectorAll('.colour-row'));
    const colourEntries = [];
    for (const row of colourRowEls) {
      const searchVal = row.querySelector('.colour-search').value.trim();
      if (!searchVal && !row.dataset.colourRef) continue; // skip fully empty rows
      if (!row.dataset.colourRef) {
        setStatus(`"${searchVal}" wasn't confirmed — press Enter on a suggestion (or click one) to select it before submitting.`, 'error');
        btn.disabled = false;
        return;
      }
      colourEntries.push({
        colourRef: Number(row.dataset.colourRef),
        inStock: row.querySelector('.colour-instock').checked,
      });
    }
    if (colourEntries.length === 0) {
      setStatus('Add at least one color.', 'error');
      btn.disabled = false;
      return;
    }

    const productTypeSelected = Array.from(document.querySelectorAll('.pt-choice:checked')).map(c => c.value);

    setStatus('Creating competitor listing...');
    const idResult = await grist.docApi.applyUserActions([
      ["AddRecord", "Competitors_ID", null, {
        Product_Name: productName,
        Source_Type: txt('f_sourceType'),
        Source_Link: sourceLink,
        Shop_Name: shopName,
        Reply_Rate: num('f_replyRate'),
        Score: num('f_score'),
        Item_Number: num('f_itemNumber'),
        Stars: num('f_stars'),
        Review_Num: num('f_reviewNum'),
        A: txt('f_province') || null,
        Product_Type: productTypeSelected.length ? ["L", ...productTypeSelected] : null,
      }]
    ]);
    const newId = idResult.retValues[0];

    setStatus(`Adding ${colourEntries.length} color(s), delivery, and pricing...`);
    const followupActions = [
      ...colourEntries.map(c => ["AddRecord", "Competitors_Colours", null, {
        Competitor_ID: newId, Colour: c.colourRef, In_Stock_: c.inStock,
      }]),
      ["AddRecord", "Competitors_Delivery", null, {
        Competitor_ID: newId,
        Instant_Delivery: document.getElementById('f_instant').checked,
        Express_Delivery: document.getElementById('f_express').checked,
        Standard_Delivery: document.getElementById('f_standard').checked,
      }],
      ["AddRecord", "Competitors_Pricing", null, {
        Competitor_ID: newId,
        Original: num('f_original'),
        Discount: num('f_discount'),
      }],
    ];
    await grist.docApi.applyUserActions(followupActions);

    const idRecords = await grist.docApi.fetchTable('Competitors_ID');
    const idx = idRecords.id.indexOf(newId);
    const cidText = idRecords.Competitor_ID[idx];

    setStatus(`Done! Created ${cidText} with ${colourEntries.length} color(s), delivery info, and pricing.`, 'success');

    document.querySelectorAll('input[type=text], input[type=url], input[type=number]').forEach(i => i.value = '');
    document.querySelectorAll('input[type=checkbox]').forEach(i => i.checked = false);
    document.getElementById('f_province').value = '';
    document.getElementById('colourRows').innerHTML = '';
    addColourRow();
  } catch (e) {
    setStatus('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
});

grist.ready({requiredAccess: 'full'});
init();
</script>
</body>
</html>
