<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>New Competitor Entry</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #ffffff;
    --fg: #222222;
    --muted: #666666;
    --hint: #999999;
    --border: #cccccc;
    --input-bg: #ffffff;
    --input-fg: #222222;
    --panel-bg: #f7f7f7;
    --suggestion-bg: #ffffff;
    --suggestion-hover-bg: #e6f7ee;
    --confirmed-border: #16a35a;
    --confirmed-bg: #f0fff4;
    --accent: #16a35a;
    --accent-fg: #ffffff;
    --accent-disabled: #aaaaaa;
    --error: #b00020;
    --success: #16a35a;
    --shadow: rgba(0, 0, 0, 0.15);
    --divider: #e0e0e0;
    --swatch-border: #cccccc;
    --remove-bg: #d9534f;
    --remove-fg: #ffffff;
    --add-border: #999999;
    --add-bg: #eeeeee;
  }

  [data-theme="dark"] {
    --bg: #1e1f22;
    --fg: #e8e8ea;
    --muted: #a5a6ab;
    --hint: #7c7d82;
    --border: #4a4b50;
    --input-bg: #2b2c30;
    --input-fg: #f0f0f2;
    --panel-bg: #28292d;
    --suggestion-bg: #2b2c30;
    --suggestion-hover-bg: #28402f;
    --confirmed-border: #3ecf7e;
    --confirmed-bg: #1d2e20;
    --accent: #2fbf71;
    --accent-fg: #07130c;
    --accent-disabled: #4a4b50;
    --error: #ff7b72;
    --success: #3ecf7e;
    --shadow: rgba(0, 0, 0, 0.6);
    --divider: #3a3b40;
    --swatch-border: #55565c;
    --remove-bg: #a6392c;
    --remove-fg: #ffffff;
    --add-border: #5a5b60;
    --add-bg: #2b2c30;
  }

  html, body { background: var(--bg); }
  body {
    font-family: -apple-system, sans-serif; padding: 16px; margin: 0; color: var(--fg);
    max-width: 640px; position: relative;
  }
  h3 { margin: 18px 0 8px; padding-top: 12px; border-top: 1px solid var(--divider); }
  h3:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  label { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; }
  input[type=text], input[type=number], input[type=url], select {
    font-size: 14px; padding: 7px; margin-top: 2px; width: 100%; border: 1px solid var(--border);
    border-radius: 4px; background: var(--input-bg); color: var(--input-fg);
  }
  input::placeholder { color: var(--hint); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .checkbox-line { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .checkbox-line input { width: auto; }

  .theme-toggle {
    position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--panel-bg); color: var(--fg); cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center; padding: 0;
  }

  .colour-row {
    display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; padding: 8px;
    background: var(--panel-bg); border-radius: 4px; flex-wrap: wrap;
  }
  .colour-type-input { flex: 0 0 150px; margin-top: 0; }
  .colour-search-wrap { flex: 1; position: relative; min-width: 160px; }
  .colour-search { width: 100%; margin-top: 0; }
  .colour-search.confirmed { border-color: var(--confirmed-border); background: var(--confirmed-bg); }
  .colour-suggestions {
    position: absolute; top: 100%; left: 0; right: 0; background: var(--suggestion-bg); border: 1px solid var(--border);
    border-radius: 4px; margin-top: 2px; max-height: 220px; overflow-y: auto; z-index: 10;
    box-shadow: 0 4px 10px var(--shadow); display: none;
  }
  .colour-suggestions.open { display: block; }
  .colour-suggestion { padding: 7px 9px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--fg); }
  .colour-suggestion .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--swatch-border); flex: 0 0 auto; }
  .colour-suggestion.active { background: var(--suggestion-hover-bg); }
  .colour-swatch-preview {
    flex: 0 0 30px; width: 30px; height: 30px; border-radius: 5px; border: 1px dashed var(--swatch-border);
    background: transparent; margin-top: 0;
  }
  .colour-swatch-preview.filled { border-style: solid; }
  .colour-instock-line { display: flex; align-items: center; gap: 4px; margin: 0; white-space: nowrap; padding-top: 8px; }
  .colour-instock-line input { width: auto; }
  .remove-colour {
    background: var(--remove-bg); color: var(--remove-fg); border: none; border-radius: 4px;
    padding: 6px 10px; cursor: pointer; align-self: flex-start; margin-top: 2px;
  }
  #addColourBtn {
    background: var(--add-bg); border: 1px dashed var(--add-border); color: var(--fg); border-radius: 4px;
    padding: 8px; width: 100%; margin-top: 8px; cursor: pointer;
  }
  #submitBtn {
    background: var(--accent); color: var(--accent-fg); border: none; border-radius: 4px;
    padding: 12px; width: 100%; margin-top: 20px; font-size: 15px; cursor: pointer; font-weight: 600;
  }
  #submitBtn:disabled { background: var(--accent-disabled); color: var(--fg); }
  #status { margin-top: 12px; white-space: pre-wrap; font-size: 13px; color: var(--muted); min-height: 20px; }
  #status.error { color: var(--error); }
  #status.success { color: var(--success); font-weight: 600; }
  .hint { font-size: 11px; color: var(--hint); margin-top: 2px; }
</style>
</head>
<body>
  <button type="button" class="theme-toggle" id="themeToggle" title="Toggle light/dark">🌙</button>

  <h3>Competitor Info</h3>
  <label>Product Name</label>
  <input type="text" id="f_productName">

  <div class="row">
    <div>
      <label>Source Type</label>
      <input type="text" id="f_sourceType" placeholder="e.g. Shopee">
    </div>
    <div>
      <label>Shop Name</label>
      <input type="text" id="f_shopName">
    </div>
  </div>

  <label>Source Link</label>
  <input type="url" id="f_sourceLink">

  <div class="row">
    <div>
      <label>Reply Rate (0–1)</label>
      <input type="number" id="f_replyRate" step="0.01" min="0" max="1">
    </div>
    <div>
      <label>Score</label>
      <input type="number" id="f_score" step="1">
    </div>
    <div>
      <label>Item Number</label>
      <input type="number" id="f_itemNumber" step="1">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Stars</label>
      <input type="number" id="f_stars" step="0.1" min="0" max="5">
    </div>
    <div>
      <label>Review Count</label>
      <input type="number" id="f_reviewNum" step="1">
    </div>
    <div>
      <label id="f_provinceLabel">Province</label>
      <input type="text" id="f_province" list="provinceListOptions" placeholder="Type or pick a province">
      <datalist id="provinceListOptions"></datalist>
      <div class="hint">Type a new one and it'll be added automatically.</div>
    </div>
  </div>

  <label>Product Type</label>
  <div id="productTypeChoices"></div>

  <h3>Colors Sold at This Listing</h3>
  <div class="hint">Type a type (e.g. "PLA Matte") to narrow the list — or leave it blank for all types. Type the first few letters of the color and press Enter to select it.</div>
  <div id="colourRows"></div>
  <datalist id="typeListOptions"></datalist>
  <button type="button" id="addColourBtn">+ Add another color</button>

  <h3>Delivery</h3>
  <div class="checkbox-line"><input type="checkbox" id="f_instant"><label style="margin:0">Instant Delivery</label></div>
  <div class="checkbox-line"><input type="checkbox" id="f_express"><label style="margin:0">Express Delivery</label></div>
  <div class="checkbox-line"><input type="checkbox" id="f_standard"><label style="margin:0">Standard Delivery</label></div>

  <h3>Pricing</h3>
  <div class="row">
    <div>
      <label>Original Price</label>
      <input type="number" id="f_original" step="0.01">
    </div>
    <div>
      <label>Discounted Price</label>
      <input type="number" id="f_discount" step="0.01">
    </div>
  </div>

  <button id="submitBtn">Submit Entry</button>
  <div id="status"></div>

<script>
// ---------- Theme ----------
function getPreferredTheme() {
  const stored = localStorage.getItem('competitorFormTheme');
  if (stored === 'dark' || stored === 'light') return stored;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('themeToggle').textContent = '☀️';
  } else {
    document.documentElement.removeAttribute('data-theme');
    document.getElementById('themeToggle').textContent = '🌙';
  }
  localStorage.setItem('competitorFormTheme', theme);
}
let currentTheme = getPreferredTheme();
applyTheme(currentTheme);
document.getElementById('themeToggle').addEventListener('click', () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  applyTheme(currentTheme);
});

// ---------- State ----------
let fcList = [];         // [{id, name, type1, type2, hex, label, typeCombo}]
let typeCombos = [];     // sorted unique "Type1 Type2" strings
let provinceChoices = [];
let productTypeChoices = [];
let provinceColType = 'Choice';
let provinceColOpts = {};

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

function matchesQuery(candidate, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  return candidate.name.toLowerCase().startsWith(q) || candidate.hex.toLowerCase().includes(q);
}

function getFilteredCandidates(row) {
  const typeVal = row.querySelector('.colour-type-input').value.trim().toLowerCase();
  const query = row.querySelector('.colour-search').value.trim();
  let pool = fcList;
  if (typeVal) pool = pool.filter(c => c.typeCombo.toLowerCase().includes(typeVal));
  pool = pool.filter(c => matchesQuery(c, query));
  return pool.slice(0, 8);
}

function setSwatchPreview(row, hex) {
  const preview = row.querySelector('.colour-swatch-preview');
  if (hex) {
    preview.style.background = hex;
    preview.classList.add('filled');
  } else {
    preview.style.background = 'transparent';
    preview.classList.remove('filled');
  }
}

function renderSuggestions(row) {
  const box = row.querySelector('.colour-suggestions');
  const candidates = getFilteredCandidates(row);
  row._activeIndex = 0;
  if (candidates.length === 0) {
    box.classList.remove('open');
    box.innerHTML = '';
    return;
  }
  box.innerHTML = candidates.map((c, i) => `
    <div class="colour-suggestion${i === 0 ? ' active' : ''}" data-idx="${i}">
      <span class="swatch" style="background:${c.hex}"></span>
      <span>${c.name} — ${c.type1} ${c.type2} (${c.hex})</span>
    </div>
  `).join('');
  box._candidates = candidates;
  box.classList.add('open');
  box.querySelectorAll('.colour-suggestion').forEach(el => {
    el.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const idx = Number(el.dataset.idx);
      selectCandidate(row, box._candidates[idx]);
    });
  });
}

function selectCandidate(row, candidate) {
  const input = row.querySelector('.colour-search');
  input.value = `${candidate.name} (${candidate.hex})`;
  input.classList.add('confirmed');
  row.dataset.colourRef = candidate.id;
  setSwatchPreview(row, candidate.hex);
  const box = row.querySelector('.colour-suggestions');
  box.classList.remove('open');
  box.innerHTML = '';
}

function addColourRow() {
  const wrap = document.getElementById('colourRows');
  const row = document.createElement('div');
  row.className = 'colour-row';
  row.innerHTML = `
    <input type="text" class="colour-type-input" list="typeListOptions" placeholder="Type (e.g. PLA Matte)" autocomplete="off">
    <div class="colour-search-wrap">
      <input type="text" class="colour-search" placeholder="Type color name, press Enter" autocomplete="off">
      <div class="colour-suggestions"></div>
    </div>
    <div class="colour-swatch-preview" title="Selected color"></div>
    <label class="colour-instock-line">
      <input type="checkbox" class="colour-instock" checked> In stock
    </label>
    <button type="button" class="remove-colour">&times;</button>
  `;
  wrap.appendChild(row);

  const typeInput = row.querySelector('.colour-type-input');
  const searchInput = row.querySelector('.colour-search');
  const suggestBox = row.querySelector('.colour-suggestions');

  typeInput.addEventListener('input', () => {
    searchInput.classList.remove('confirmed');
    delete row.dataset.colourRef;
    setSwatchPreview(row, null);
    renderSuggestions(row);
  });

  searchInput.addEventListener('input', () => {
    searchInput.classList.remove('confirmed');
    delete row.dataset.colourRef;
    setSwatchPreview(row, null);
    renderSuggestions(row);
  });

  searchInput.addEventListener('focus', () => renderSuggestions(row));

  searchInput.addEventListener('keydown', (e) => {
    const items = Array.from(suggestBox.querySelectorAll('.colour-suggestion'));
    if (e.key === 'Enter') {
      e.preventDefault();
      const candidates = suggestBox._candidates || [];
      if (candidates.length > 0) {
        selectCandidate(row, candidates[row._activeIndex || 0]);
      }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!items.length) return;
      row._activeIndex = Math.min((row._activeIndex || 0) + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('active', i === row._activeIndex));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      row._activeIndex = Math.max((row._activeIndex || 0) - 1, 0);
      items.forEach((el, i) => el.classList.toggle('active', i === row._activeIndex));
    } else if (e.key === 'Escape') {
      suggestBox.classList.remove('open');
    }
  });

  document.addEventListener('click', (e) => {
    if (!row.contains(e.target)) suggestBox.classList.remove('open');
  });

  row.querySelector('.remove-colour').addEventListener('click', () => row.remove());
}

function refreshProvinceDatalist() {
  const list = document.getElementById('provinceListOptions');
  list.innerHTML = provinceChoices.map(c => `<option value="${c}"></option>`).join('');
}

async function init() {
  try {
    const fc = await grist.docApi.fetchTable('Filament_Colours');
    const comboSet = new Set();
    fcList = fc.id.map((id, i) => {
      const type1 = fc.Type_1[i] || '';
      const type2 = fc.Type_2[i] || '';
      const combo = `${type1} ${type2}`.trim();
      comboSet.add(combo);
      return {
        id,
        name: fc.Colour_Name[i] || '',
        type1, type2,
        hex: fc.ColourCode[i] || '',
        label: fc.Label[i] || '',
        typeCombo: combo,
      };
    }).sort((a, b) => a.name.localeCompare(b.name));
    typeCombos = Array.from(comboSet).filter(Boolean).sort();
    document.getElementById('typeListOptions').innerHTML =
      typeCombos.map(t => `<option value="${t}"></option>`).join('');

    // Province (Choice) options from Competitors_ID column "A"
    const idCols = await grist.docApi.fetchTable('_grist_Tables_column');
    const tables = await grist.docApi.fetchTable('_grist_Tables');
    const cidTableRowId = tables.id[tables.tableId.indexOf('Competitors_ID')];
    const aIdx = idCols.colId.findIndex((c, i) => c === 'A' && idCols.parentId[i] === cidTableRowId);
    const ptIdx = idCols.colId.findIndex((c, i) => c === 'Product_Type' && idCols.parentId[i] === cidTableRowId);

    provinceColType = idCols.type[aIdx];
    provinceColOpts = JSON.parse(idCols.widgetOptions[aIdx] || '{}');
    provinceChoices = provinceColOpts.choices || [];
    document.getElementById('f_provinceLabel').textContent = idCols.label[aIdx] || 'Province';
    refreshProvinceDatalist();

    const ptOpts = JSON.parse(idCols.widgetOptions[ptIdx] || '{}');
    productTypeChoices = ptOpts.choices || [];
    const ptDiv = document.getElementById('productTypeChoices');
    ptDiv.innerHTML = productTypeChoices.map((c) =>
      `<label class="checkbox-line"><input type="checkbox" class="pt-choice" value="${c}"> ${c}</label>`
    ).join('');

    addColourRow();
  } catch (e) {
    setStatus('Failed to load form data: ' + e.message, 'error');
  }
}

document.getElementById('addColourBtn').addEventListener('click', () => addColourRow());

function num(id) {
  const v = document.getElementById(id).value;
  return v === '' ? null : Number(v);
}
function txt(id) {
  return document.getElementById(id).value.trim();
}

// Adds a new province choice to the Competitors_ID.A column definition so it's
// usable (and colored/consistent) right away, without needing to reopen Grist.
async function ensureProvinceChoice(province) {
  if (!province) return;
  const alreadyExists = provinceChoices.some(c => c.toLowerCase() === province.toLowerCase());
  if (alreadyExists) return;
  const updatedChoices = [...provinceChoices, province];
  await grist.docApi.applyUserActions([
    ["ModifyColumn", "Competitors_ID", "A", {
      type: provinceColType,
      widgetOptions: JSON.stringify({ ...provinceColOpts, choices: updatedChoices }),
    }]
  ]);
  provinceChoices = updatedChoices;
  provinceColOpts = { ...provinceColOpts, choices: updatedChoices };
  refreshProvinceDatalist();
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  try {
    const productName = txt('f_productName');
    const shopName = txt('f_shopName');
    const sourceLink = txt('f_sourceLink');
    if (!productName || !shopName || !sourceLink) {
      setStatus('Product Name, Shop Name, and Source Link are required.', 'error');
      btn.disabled = false;
      return;
    }

    const colourRowEls = Array.from(document.querySelectorAll('.colour-row'));
    const colourEntries = [];
    for (const row of colourRowEls) {
      const searchVal = row.querySelector('.colour-search').value.trim();
      if (!searchVal && !row.dataset.colourRef) continue; // skip fully empty rows
      if (!row.dataset.colourRef) {
        setStatus(`"${searchVal}" wasn't confirmed — press Enter on a suggestion (or click one) to select it before submitting.`, 'error');
        btn.disabled = false;
        return;
      }
      colourEntries.push({
        colourRef: Number(row.dataset.colourRef),
        inStock: row.querySelector('.colour-instock').checked,
      });
    }
    if (colourEntries.length === 0) {
      setStatus('Add at least one color.', 'error');
      btn.disabled = false;
      return;
    }

    const productTypeSelected = Array.from(document.querySelectorAll('.pt-choice:checked')).map(c => c.value);
    const provinceVal = txt('f_province');

    if (provinceVal) {
      setStatus('Checking province...');
      await ensureProvinceChoice(provinceVal);
    }

    setStatus('Creating competitor listing...');
    const idResult = await grist.docApi.applyUserActions([
      ["AddRecord", "Competitors_ID", null, {
        Product_Name: productName,
        Source_Type: txt('f_sourceType'),
        Source_Link: sourceLink,
        Shop_Name: shopName,
        Reply_Rate: num('f_replyRate'),
        Score: num('f_score'),
        Item_Number: num('f_itemNumber'),
        Stars: num('f_stars'),
        Review_Num: num('f_reviewNum'),
        A: provinceVal || null,
        Product_Type: productTypeSelected.length ? ["L", ...productTypeSelected] : null,
      }]
    ]);
    const newId = idResult.retValues[0];

    setStatus(`Adding ${colourEntries.length} color(s), delivery, and pricing...`);
    const followupActions = [
      ...colourEntries.map(c => ["AddRecord", "Competitors_Colours", null, {
        Competitor_ID: newId, Colour: c.colourRef, In_Stock_: c.inStock,
      }]),
      ["AddRecord", "Competitors_Delivery", null, {
        Competitor_ID: newId,
        Instant_Delivery: document.getElementById('f_instant').checked,
        Express_Delivery: document.getElementById('f_express').checked,
        Standard_Delivery: document.getElementById('f_standard').checked,
      }],
      ["AddRecord", "Competitors_Pricing", null, {
        Competitor_ID: newId,
        Original: num('f_original'),
        Discount: num('f_discount'),
      }],
    ];
    await grist.docApi.applyUserActions(followupActions);

    const idRecords = await grist.docApi.fetchTable('Competitors_ID');
    const idx = idRecords.id.indexOf(newId);
    const cidText = idRecords.Competitor_ID[idx];

    setStatus(`Done! Created ${cidText} with ${colourEntries.length} color(s), delivery info, and pricing.`, 'success');

    document.querySelectorAll('input[type=text], input[type=url], input[type=number]').forEach(i => i.value = '');
    document.querySelectorAll('input[type=checkbox]').forEach(i => i.checked = false);
    document.getElementById('f_province').value = '';
    document.getElementById('colourRows').innerHTML = '';
    addColourRow();
  } catch (e) {
    setStatus('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
});

grist.ready({requiredAccess: 'full'});
init();
</script>
</body>
</html>
